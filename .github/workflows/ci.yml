name: CI

# Runs on every push and pull request, so a change that breaks the build is
# caught straight away rather than at release time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The release builds every platform from one runner, so check they still
      # compile here rather than finding out while cutting a tag.
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            echo "building $GOOS/$GOARCH"
            go build -o /dev/null ./cmd/server
            go build -o /dev/null ./cmd/doables
          done

  # Builds the image on every run so the Dockerfile cannot quietly rot, and
  # publishes it only from main, as ghcr.io/<owner>/doables:main. The :latest
  # tag belongs to the release workflow, so someone who pulls :latest gets the
  # newest release rather than whatever main happens to be today.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Work out the image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/doables" >> "$GITHUB_OUTPUT"

      # Building it is not the same as it working, so start the image and
      # check it actually serves the app before anything is published.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker buildx build --load -t doables:test .
          docker run -d --name doables-test -p 8080:8080 doables:test
          up=
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/welcome > /dev/null; then up=1; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error::the container never started serving"
            docker logs doables-test
            exit 1
          fi
          curl -sf http://localhost:8080/manifest.webmanifest > /dev/null
          curl -sf http://localhost:8080/static/icon-192.png > /dev/null
          echo "the image starts and serves the app"
          docker rm -f doables-test

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t '${{ steps.img.outputs.name }}:main' \
            -t '${{ steps.img.outputs.name }}:${{ github.sha }}' .
