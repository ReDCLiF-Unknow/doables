name: Security

# Checks the code and everything it depends on against Go's vulnerability
# database. On every change, and also every week, because a problem can be
# published about code that has not changed: a self-hosted app runs on other
# people's servers, so it should not wait for someone to notice.
#
# It fails only when a vulnerability is in code Doables actually calls. One
# that sits in an unused corner of a dependency is reported but does not fail.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays, early
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Go version in go.mod, so a fix in a newer Go release (the standard
      # library has vulnerabilities too) shows up here as a reason to move on.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
